[package]
name = "rustagent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustagent"
path = "src/main.rs"

[dependencies]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
mem_forget = "warn"

cargo_common_metadata = "allow"
missing_errors_doc = "allow"
